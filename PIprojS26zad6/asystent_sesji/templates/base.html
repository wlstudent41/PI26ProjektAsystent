{% load static %}
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Asystent Sesji{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header class="navbar">
        <div class="logo">Asystent Sesji</div>
        <nav>
            <a href="{% url 'index' %}">Strona Główna</a>
            <a href="{% url 'kalendarz' %}">Kalendarz Egzaminów</a>
            <a href="{% url 'przesady' %}">Przesądy</a>
        </nav>
    </header>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; Asystent Sesji - Wsparcie podczas egzaminów</p>
    </footer>

    {% block extra_js %}{% endblock %}
</body>
</html>
